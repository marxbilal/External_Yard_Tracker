# Netlify only hosts the screens in /public. There is no server code: the pages talk
# straight to Supabase (public/config.js), which enforces who may see and change what.
[build]
  publish = "public"
  command = "echo 'no build step'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'"
